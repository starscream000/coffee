# Project configuration of the demo app used by the integration tests.
# Files under fixtures/ are not matched by "tests", so they run only when named.
version: 1
tests: ['tests/**/*.test.yaml']
flows: ['flows/**/*.flow.yaml', 'fixtures/**/*.flow.yaml']
targets: ['targets/**/*.targets.yaml']

defaults:
  environment: local
  browser: chromium

environments:
  local:
    baseUrl: http://localhost:4310
    values:
      apiUrl: http://localhost:4310/api
      expectedLocale: en-US
      expectedTimezone: UTC

secrets: [DEMO_PASSWORD]

# S8, S18, I11: two saved logins that sign in through the demo app's /login.
logins:
  customer:
    flow: flows/login.flow.yaml
    with: { user: alice, password: '${secrets.DEMO_PASSWORD}' }
  admin:
    flow: flows/login.flow.yaml
    with: { user: ada, password: '${secrets.DEMO_PASSWORD}' }
    maxAge: 2h
