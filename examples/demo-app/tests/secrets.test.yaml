# S9: the secret DEMO_PASSWORD signs in (in the login flow's fill), is typed
# into a field, shown on the page and sent in an api header. Nothing the engine
# writes out holds it (A9).
version: 1
name: A secret in a field, a header and a page
login: customer
steps:
  - goto: /notes
  - fill: { target: notes.note, value: '${secrets.DEMO_PASSWORD}' }
  - click: notes.show
  - expect.text: { target: notes.shown, equals: '${secrets.DEMO_PASSWORD}' }
  - api:
      url: /api/whoami
      headers: { X-Demo-Password: '${secrets.DEMO_PASSWORD}' }
      status: 200
      as: me
