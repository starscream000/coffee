# S17: the browser uses the environment's viewport, locale and timezone. The
# expected values are environment values, so an environment that overrides
# locale and timezone (its integration test adds one) runs the same file.
version: 1
name: The browser uses the environment's settings
steps:
  - goto: /settings
  - expect.text: { target: settings.viewport, equals: 1280×720 }
  - expect.text: { target: settings.locale, equals: '${env.expectedLocale}' }
  - expect.text: { target: settings.timezone, equals: '${env.expectedTimezone}' }
