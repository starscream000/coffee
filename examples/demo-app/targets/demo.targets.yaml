# Shared targets for the demo app's pages (examples/demo-app/README.md).
version: 1
targets:
  todos.new:
    - label: New to-do
    - testId: new-todo
  todos.add:
    - role: button
      name: Add
  todos.count:
    - testId: todo-count
  todos.clearAll:
    - role: button
      name: Clear all
  # S11: the button was renamed "Submit order"; only its test ID still matches.
  order.placeOrder:
    - role: button
      name: Place order
    - testId: place-order
  order.status:
    - testId: order-status
  # S12: the placeholder matches the CSS fallback at once, the button 500 ms later.
  cart.checkout:
    - role: button
      name: Check out
    - css: .checkout-button
  cart.status:
    - testId: checkout-status
  # S14: the payment form sits in an iframe inside an iframe.
  checkoutFrame:
    - css: iframe#checkout
  paymentFrame:
    frame: checkoutFrame
    candidates:
      - css: 'iframe[title="Secure payment"]'
  payment.cardNumber:
    frame: paymentFrame
    candidates:
      - label: Card number
  payment.pay:
    frame: paymentFrame
    candidates:
      - role: button
        name: Pay
  payment.status:
    frame: paymentFrame
    candidates:
      - testId: payment-status
  # S7: a named tab and an unnamed one.
  tabs.heading:
    - role: heading
      name: Tabs
  tabs.openReceipt:
    - role: link
      name: Open receipt
  tabs.openHelp:
    - role: button
      name: Open help
  receipt.heading:
    - role: heading
      name: Receipt
  # S17: what the browser reports about its settings.
  settings.viewport:
    - testId: viewport
  settings.locale:
    - testId: locale
  settings.timezone:
    - testId: timezone
  # S8, S18: signing in, and who is signed in.
  login.username:
    - label: Username
  login.password:
    - label: Password
  login.submit:
    - role: button
      name: Sign in
  account.user:
    - testId: account-user
  # S2: the order form.
  form.name:
    - label: Name
  form.country:
    - label: Country
  form.toppings:
    - label: Toppings
  form.subscribe:
    - role: checkbox
      name: Subscribe to the newsletter
  form.attachment:
    - label: Attachment
  form.search:
    - label: Search
  form.searchResult:
    - testId: search-result
  form.send:
    - role: button
      name: Send order
  form.summary:
    - testId: form-summary
  # S3: hover and drag.
  interactions.help:
    - role: button
      name: Help
  interactions.tooltip:
    - testId: tooltip
  fruit.apple:
    - testId: fruit-apple
  fruit.cherry:
    - testId: fruit-cherry
  fruit.order:
    - testId: fruit-order
  fruit.list:
    - testId: fruit-list
  fruit.items:
    within: fruit.list
    candidates:
      - role: listitem
  # S16: the products table.
  products.count:
    - testId: product-count
  # S4: the orders page.
  orders.load:
    - role: button
      name: Load orders
  orders.list:
    - role: list
      name: Orders
  orders.items:
    within: orders.list
    candidates:
      - role: listitem
  orders.summary:
    - testId: order-summary
  # S9: the notes page.
  notes.note:
    - label: Note
  notes.show:
    - role: button
      name: Show note
  notes.shown:
    - testId: note-shown
  # S19: the token page.
  token.get:
    - role: button
      name: Get token
  token.status:
    - testId: token-status
