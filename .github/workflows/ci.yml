# Continuous integration: type check, lint, format check and tests on
# Linux, Windows and macOS for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type check first: it builds the packages that type-aware linting resolves.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec vitest run

  # Browser tests (`pnpm test:integration`) against Playwright's headless
  # Chromium. The browser download is cached per system and Playwright version.
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./packages/engine/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cfe/engine exec playwright install --only-shell chromium
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        run: pnpm --filter @cfe/engine exec playwright install-deps chromium-headless-shell
      - run: pnpm test:integration
