# Continuous integration: type check, lint, format check and tests, and the
# desktop app's build and tests, on Linux, Windows and macOS for every push
# and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type check first: it builds the packages that type-aware linting resolves.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec vitest run

  # The desktop app (apps/desktop): code style, a warnings-as-errors build and
  # all C# tests. The engine is built first, because some desktop tests start
  # the real engine and read the protocol's JSON Schema files.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ContinuousIntegrationBuild: true
      DOTNET_NOLOGO: true
      # Real-engine tests fail instead of skipping when the engine is missing.
      DESKTOP_TESTS_REQUIRE_ENGINE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/desktop/global.json
          cache: true
          cache-dependency-path: apps/desktop/**/packages.lock.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: dotnet restore apps/desktop/Desktop.slnx --locked-mode
      - run: dotnet format apps/desktop/Desktop.slnx --verify-no-changes --no-restore
      - run: dotnet build apps/desktop/Desktop.slnx --no-restore -c Release
      - run: dotnet test apps/desktop/Desktop.slnx --no-build -c Release --logger trx --results-directory apps/desktop/TestResults
      # Shows each failed test, with its message, on the pull request itself.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { Write-Output "::error title=No test results::dotnet test wrote no result file; a test process may have crashed." }
          foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $failed = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
            foreach ($test in $failed | Select-Object -First 9) {
              $text = "$($test.Output.ErrorInfo.Message)`n$($test.Output.ErrorInfo.StackTrace)"
              if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
              $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error title=$($test.testName)::$text"
            }
            if ($failed.Count -gt 9) { Write-Output "::error title=More failures::$($failed.Count) tests failed in $($file.Name); the first 9 are shown." }
          }
