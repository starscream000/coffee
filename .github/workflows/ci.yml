# Continuous integration on Linux, Windows and macOS, for every push to main and
# every pull request: type check, lint, format check and unit tests (verify),
# the browser tests (integration), and the desktop app's build and tests
# (desktop).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type check first: it builds the packages that type-aware linting resolves.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec vitest run

  # Browser tests (`pnpm test:integration`) against Playwright's headless
  # Chromium. The browser download is cached per system and Playwright version.
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./packages/engine/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cfe/engine exec playwright install --only-shell chromium
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        run: pnpm --filter @cfe/engine exec playwright install-deps chromium-headless-shell
      - run: pnpm test:integration

  # The desktop app (apps/desktop): code style, a warnings-as-errors build and
  # all C# tests. The engine is built first, because some desktop tests start
  # the real engine and read the protocol's JSON Schema files.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ContinuousIntegrationBuild: true
      DOTNET_NOLOGO: true
      # Real-engine tests fail instead of skipping when the engine is missing,
      # and real-browser tests when the engine reports no browser.
      DESKTOP_TESTS_REQUIRE_ENGINE: 1
      DESKTOP_TESTS_REQUIRE_BROWSER: 1
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/desktop/global.json
          cache: true
          cache-dependency-path: apps/desktop/**/packages.lock.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser for the desktop tests that run real tests through the
      # engine; the same cache as the integration job.
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./packages/engine/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cfe/engine exec playwright install --only-shell chromium
      - name: Install Chromium's system libraries
        if: runner.os == 'Linux'
        run: pnpm --filter @cfe/engine exec playwright install-deps chromium-headless-shell
      - run: dotnet restore apps/desktop/Desktop.slnx --locked-mode
      - run: dotnet format apps/desktop/Desktop.slnx --verify-no-changes --no-restore
      - run: dotnet build apps/desktop/Desktop.slnx --no-restore -c Release
      - run: dotnet test apps/desktop/Desktop.slnx --no-build -c Release --logger trx --results-directory apps/desktop/TestResults
      # Shows each failed test, with its message, on the pull request itself.
      - name: Report failed tests
        if: failure()
        run: node .github/scripts/report-failed-tests.mjs apps/desktop/TestResults
